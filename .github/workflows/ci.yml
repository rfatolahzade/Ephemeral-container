name: Docker Build and Push

on:
  push:
    branches: [ 'master', 'main', 'beta' ]
    tags: [ '*' ] # Triggers on ANY git tag (e.g., v1.0.0, test-build, release-candidate)
  pull_request:
    branches: [ 'master', 'main' ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI
    inputs:
      custom_tag:
        description: 'Custom tag to apply to the image (e.g., manual-test-1)'
        required: false
        default: 'manual-build'

env:
  DOCKERHUB_USERNAME: rfinland
  IMAGE_NAME: ephemeral-container
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Determine which registries to target (Beta = Docker Hub only)
      - name: Set target registries
        id: regs
        run: |
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "images=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "images=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/beta'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.regs.outputs.images }}
          tags: |
            # Branch names (e.g., beta)
            type=ref,event=branch
            # Git tags (e.g., v1.0.0, my-custom-tag)
            type=ref,event=tag
            # Semantic versioning cleanup (v1.0.0 -> 1.0.0 and 1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Latest tag (only for master/main)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            # Beta tag (only for beta branch)
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/beta' }}
            # Manual dispatch custom tag
            type=raw,value=${{ inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push is false for PRs (acts as a pre-merge build check)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
